<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704"
     width="960" height="704" role="img" aria-labelledby="title desc">
  <title id="title">Evaluate your RAG with rag-titan, step by step</title>
  <desc id="desc">Seven steps: prepare your documents, write golden questions, ask your RAG the same questions, capture what it did, build the data file, run rag-titan evaluate, then read the scores, improve and run again. In the guide's example the overall score goes from 81.2 to 87.1.</desc>
  <defs>
    <style>
.bg { fill: #ffffff; stroke: #e2e8f0; }
.title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
.sub { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
.label { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
.small { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
.num { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
.big { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
.warn { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c2410c; }
.neutral, .search, .llm { stroke-width: 1.5; }
.neutral { fill: #f8fafc; stroke: #94a3b8; } .search { fill: #ecfeff; stroke: #06b6d4; }
.llm { fill: #fffbeb; stroke: #f59e0b; }
.card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
.track { fill: #e2e8f0; }
.flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5;
        animation: dash 0.9s linear infinite; }
.bar { transform-box: fill-box; transform-origin: left center; }
@keyframes dash { to { stroke-dashoffset: -11; } }
@media (prefers-reduced-motion: reduce) {
  .flow, .anim { animation: none !important; opacity: 1 !important; transform: none !important; }
  .glow { display: none; }
}

.step { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
.dot { fill: #4f46e5; }
.out { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
.pill { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; }
.who { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
.loop { fill: none; stroke: #4f46e5; stroke-width: 2; stroke-dasharray: 6 5;
        animation: dash 0.9s linear infinite; }
@keyframes g1 { 0%, 2.9% { opacity: 0; } 4.3%, 10.7% { opacity: 1; } 12.9%, 100% { opacity: 0; } }
.g1 { animation: g1 14.0s infinite; }
@keyframes g2 { 0%, 15.0% { opacity: 0; } 16.4%, 22.9% { opacity: 1; } 25.0%, 100% { opacity: 0; } }
.g2 { animation: g2 14.0s infinite; }
@keyframes g3 { 0%, 27.1% { opacity: 0; } 28.6%, 35.0% { opacity: 1; } 37.1%, 100% { opacity: 0; } }
.g3 { animation: g3 14.0s infinite; }
@keyframes g4 { 0%, 39.3% { opacity: 0; } 40.7%, 47.1% { opacity: 1; } 49.3%, 100% { opacity: 0; } }
.g4 { animation: g4 14.0s infinite; }
@keyframes g5 { 0%, 51.4% { opacity: 0; } 52.9%, 59.3% { opacity: 1; } 61.4%, 100% { opacity: 0; } }
.g5 { animation: g5 14.0s infinite; }
@keyframes g6 { 0%, 63.6% { opacity: 0; } 65.0%, 71.4% { opacity: 1; } 73.6%, 100% { opacity: 0; } }
.g6 { animation: g6 14.0s infinite; }
@keyframes g7 { 0%, 75.7% { opacity: 0; } 77.1%, 83.6% { opacity: 1; } 85.7%, 100% { opacity: 0; } }
.g7 { animation: g7 14.0s infinite; }
</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="703" rx="16"/>
  <text class="title" x="30" y="44">Evaluate your RAG, step by step</text>
  <text class="small" x="30" y="70">Left: each step and who does it. Right: what the step produces.</text>
  <rect class="neutral" x="70" y="104" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="136" r="15"/>
  <text class="step" x="102" y="141" text-anchor="middle">1</text>
  <text class="label" x="130" y="126">Prepare your documents</text>
  <text class="who" x="614" y="126" text-anchor="end">you</text>
  <text class="small" x="130" y="144">profile_documents() finds empty, tiny and duplicated files</text>
  <text class="small" x="130" y="160">keep the clean ones</text>
  <path class="flow" d="M634 136 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="116" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="141" text-anchor="middle">clean documents</text>
  <path class="flow" d="M350 170 V180" marker-end="url(#arrow)"/>
  <rect class="glow g1" x="67" y="101" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <rect class="neutral" x="70" y="184" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="216" r="15"/>
  <text class="step" x="102" y="221" text-anchor="middle">2</text>
  <text class="label" x="130" y="206">Write golden questions</text>
  <text class="who" x="614" y="206" text-anchor="end">you</text>
  <text class="small" x="130" y="224">question + correct answer + evidence quote</text>
  <text class="small" x="130" y="240">rag-titan golden drafts them, you review every one</text>
  <path class="flow" d="M634 216 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="196" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="221" text-anchor="middle">golden.json</text>
  <path class="flow" d="M350 250 V260" marker-end="url(#arrow)"/>
  <rect class="glow g2" x="67" y="181" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <rect class="search" x="70" y="264" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="296" r="15"/>
  <text class="step" x="102" y="301" text-anchor="middle">3</text>
  <text class="label" x="130" y="286">Ask YOUR RAG the same questions</text>
  <text class="who" x="614" y="286" text-anchor="end">your RAG</text>
  <text class="small" x="130" y="304">any framework, model or vector database</text>
  <text class="small" x="130" y="320">rag-titan is not involved here</text>
  <path class="flow" d="M634 296 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="276" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="301" text-anchor="middle">answers</text>
  <path class="flow" d="M350 330 V340" marker-end="url(#arrow)"/>
  <rect class="glow g3" x="67" y="261" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <rect class="search" x="70" y="344" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="376" r="15"/>
  <text class="step" x="102" y="381" text-anchor="middle">4</text>
  <text class="label" x="130" y="366">Capture what it did</text>
  <text class="who" x="614" y="366" text-anchor="end">your RAG</text>
  <text class="small" x="130" y="384">per question: retrieved ids, context ids, answer</text>
  <text class="small" x="130" y="400">once: chunks + metadata, documents, vectors</text>
  <path class="flow" d="M634 376 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="356" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="381" text-anchor="middle">my_rag_logs.json</text>
  <path class="flow" d="M350 410 V420" marker-end="url(#arrow)"/>
  <rect class="glow g4" x="67" y="341" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <rect class="llm" x="70" y="424" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="456" r="15"/>
  <text class="step" x="102" y="461" text-anchor="middle">5</text>
  <text class="label" x="130" y="446">Build the data file</text>
  <text class="who" x="614" y="446" text-anchor="end">rag-titan</text>
  <text class="small" x="130" y="464">build_dataset() joins your logs with golden.json</text>
  <text class="small" x="130" y="480">then add the chunking and embedding fields</text>
  <path class="flow" d="M634 456 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="436" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="461" text-anchor="middle">eval-data.json</text>
  <path class="flow" d="M350 490 V500" marker-end="url(#arrow)"/>
  <rect class="glow g5" x="67" y="421" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <rect class="llm" x="70" y="504" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="536" r="15"/>
  <text class="step" x="102" y="541" text-anchor="middle">6</text>
  <text class="label" x="130" y="526">rag-titan evaluate</text>
  <text class="who" x="614" y="526" text-anchor="end">rag-titan</text>
  <text class="small" x="130" y="544">scores 7 stages from 0 to 100, no LLM judge</text>
  <text class="small" x="130" y="560">names the first failing stage</text>
  <path class="flow" d="M634 536 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="516" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="541" text-anchor="middle">report.json + report.md</text>
  <path class="flow" d="M350 570 V580" marker-end="url(#arrow)"/>
  <rect class="glow g6" x="67" y="501" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <rect class="neutral" x="70" y="584" width="560" height="64" rx="12"/>
  <circle class="dot" cx="102" cy="616" r="15"/>
  <text class="step" x="102" y="621" text-anchor="middle">7</text>
  <text class="label" x="130" y="606">Read the scores, improve, run again</text>
  <text class="who" x="614" y="606" text-anchor="end">you</text>
  <text class="small" x="130" y="624">fix the first failing stage in your RAG</text>
  <text class="small" x="130" y="640">--baseline shows what got better or worse</text>
  <path class="flow" d="M634 616 H676" marker-end="url(#arrow)"/>
  <rect class="pill" x="680" y="596" width="250" height="40" rx="20"/>
  <text class="out" x="805" y="621" text-anchor="middle">score 81.2 → 87.1</text>
  <rect class="glow g7" x="67" y="581" width="566" height="70" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <path class="loop" d="M70 616 H40 V296 H64" marker-end="url(#back)"/>
  <text class="who" transform="translate(30 456) rotate(-90)" text-anchor="middle">run again</text>
  <text class="small" x="30" y="688">Real scores from the guide's example: a small stand-in RAG before and after one improvement.</text>
</svg>
