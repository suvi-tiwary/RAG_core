<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation architecture</title>
  <desc id="desc">You pass chunks, queries with gold labels and logged outputs, and optionally the source text and vectors. RAGEvaluator runs one evaluator per pipeline stage: ChunkEvaluator, EmbeddingEvaluator, RetrievalEvaluator, RerankingEvaluator, AugmentationEvaluator, GenerationEvaluator and EndToEndEvaluator, then RootCauseAnalyzer names the first failing stage. ScoreAggregator turns the metrics into 0 to 100 scores. ReportManager saves JSON and Markdown reports, finds regressions against a baseline, and shows trends.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .big { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .ex { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; text-anchor: middle; }
      .head { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .06em; }
      .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .search { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .llm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .badge { fill: #0f172a; }
      .badgenum { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -11; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="689" rx="16"/>
  <text class="title" x="30" y="44">Evaluation architecture: data in, report out</text>
  <text class="sub" x="30" y="68">report = RAGEvaluator(k=5).evaluate(chunks=..., queries=..., documents=...)</text>

  <!-- 1. the data you pass -->
  <circle class="badge" cx="42" cy="104" r="11"/>
  <text class="badgenum" x="42" y="108">1</text>
  <text class="head" x="62" y="108">YOUR DATA (LOGGED OUTPUTS OF ANY RAG SYSTEM + GOLD LABELS)</text>

  <rect class="neutral" x="30" y="122" width="285" height="54" rx="10"/>
  <text class="label" x="172" y="145">chunks</text>
  <text class="ex" x="172" y="163">id · text · start · end · metadata</text>

  <rect class="neutral" x="337" y="122" width="285" height="54" rx="10"/>
  <text class="label" x="479" y="145">queries</text>
  <text class="ex" x="479" y="163">gold labels + logged outputs</text>

  <rect class="neutral" x="644" y="122" width="286" height="54" rx="10"/>
  <text class="label" x="787" y="145">documents · embeddings</text>
  <text class="ex" x="787" y="163">optional: more metrics when given</text>

  <path class="flow" d="M479 176 V212" marker-end="url(#arrow)"/>

  <!-- 2. RAGEvaluator and the stage evaluators -->
  <rect class="card" x="30" y="216" width="900" height="244" rx="14"/>
  <circle class="badge" cx="56" cy="244" r="11"/>
  <text class="badgenum" x="56" y="248">2</text>
  <text class="big" x="480" y="249">RAGEvaluator</text>
  <text class="note" x="480" y="268">one call · runs every stage that has data · a metric without data is "not measured", never 0</text>

  <rect class="search" x="48" y="284" width="204" height="70" rx="10"/>
  <text class="label" x="150" y="308">ChunkEvaluator</text>
  <text class="ex" x="150" y="326">coverage · boundary F1</text>
  <text class="ex" x="150" y="342">evidence completeness</text>

  <rect class="search" x="268" y="284" width="204" height="70" rx="10"/>
  <text class="label" x="370" y="308">EmbeddingEvaluator</text>
  <text class="ex" x="370" y="326">index coverage · ANN recall</text>
  <text class="ex" x="370" y="342">similarity margin</text>

  <rect class="search" x="488" y="284" width="204" height="70" rx="10"/>
  <text class="label" x="590" y="308">RetrievalEvaluator</text>
  <text class="ex" x="590" y="326">Recall@K · MRR · nDCG@K</text>
  <text class="ex" x="590" y="342">token recall · token IoU</text>

  <rect class="search" x="708" y="284" width="204" height="70" rx="10"/>
  <text class="label" x="810" y="308">RerankingEvaluator</text>
  <text class="ex" x="810" y="326">nDCG gain · MRR gain</text>
  <text class="ex" x="810" y="342">rank change</text>

  <rect class="llm" x="48" y="370" width="204" height="70" rx="10"/>
  <text class="label" x="150" y="394">AugmentationEvaluator</text>
  <text class="ex" x="150" y="412">context recall · noise</text>
  <text class="ex" x="150" y="428">sufficiency · budget</text>

  <rect class="llm" x="268" y="370" width="204" height="70" rx="10"/>
  <text class="label" x="370" y="394">GenerationEvaluator</text>
  <text class="ex" x="370" y="412">answer F1 · ROUGE-L</text>
  <text class="ex" x="370" y="428">citations · grounding</text>

  <rect class="llm" x="488" y="370" width="204" height="70" rx="10"/>
  <text class="label" x="590" y="394">EndToEndEvaluator</text>
  <text class="ex" x="590" y="412">task success · exact match</text>
  <text class="ex" x="590" y="428">P95 latency · cost</text>

  <rect class="out" x="708" y="370" width="204" height="70" rx="10"/>
  <text class="label" x="810" y="394">RootCauseAnalyzer</text>
  <text class="ex" x="810" y="412">first failing stage</text>
  <text class="ex" x="810" y="428">+ what to try</text>

  <path class="flow" d="M480 460 V490" marker-end="url(#arrow)"/>

  <!-- 3. scorecard -->
  <circle class="badge" cx="234" cy="521" r="11"/>
  <text class="badgenum" x="234" y="525">3</text>
  <rect class="out" x="260" y="494" width="440" height="54" rx="10"/>
  <text class="label" x="480" y="517">ScoreAggregator</text>
  <text class="ex" x="480" y="535">0-100 per stage and overall · ratings · quality gates</text>

  <path class="flow" d="M480 548 V578" marker-end="url(#arrow)"/>

  <!-- 4. reports -->
  <circle class="badge" cx="42" cy="600" r="11"/>
  <text class="badgenum" x="42" y="604">4</text>
  <text class="head" x="62" y="604">REPORTMANAGER</text>

  <rect class="out" x="30" y="618" width="210" height="50" rx="10"/>
  <text class="label" x="135" y="639">JSON + Markdown</text>
  <text class="ex" x="135" y="656">report.json · report.md</text>

  <rect class="out" x="260" y="618" width="210" height="50" rx="10"/>
  <text class="label" x="365" y="639">Regressions</text>
  <text class="ex" x="365" y="656">worse than the baseline?</text>

  <rect class="out" x="490" y="618" width="210" height="50" rx="10"/>
  <text class="label" x="595" y="639">Trends</text>
  <text class="ex" x="595" y="656">first to last run</text>

  <rect class="out" x="720" y="618" width="210" height="50" rx="10"/>
  <text class="label" x="825" y="639">Queries to look at</text>
  <text class="ex" x="825" y="656">which failed, at which stage</text>
</svg>
