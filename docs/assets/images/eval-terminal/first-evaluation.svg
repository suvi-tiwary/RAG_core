<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 426"
     width="960" height="426" role="img" aria-labelledby="title desc">
  <title id="title">rag-titan: Your first evaluation</title>
  <desc id="desc">Score the two logged handbook questions, then print the key metrics.</desc>
  <defs>
    <style>
.t { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.bar { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: #94a3b8; text-anchor: middle; }
@media (prefers-reduced-motion: reduce) {
  .t { animation: none !important; opacity: 1; }
  .cover { display: none; }
}
@keyframes l0 { 0%, 2.57% { opacity: 0; } 3.86%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l0 { animation: l0 15.5s infinite; }
@keyframes c0 { 0%, 2.57% { transform: translateX(0); } 12.86%, 100% { transform: translateX(578px); } }
.c0 { animation: c0 15.5s infinite steps(67, end); }
@keyframes l1 { 0%, 18.65% { opacity: 0; } 19.94%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l1 { animation: l1 15.5s infinite; }
@keyframes l2 { 0%, 21.54% { opacity: 0; } 22.83%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l2 { animation: l2 15.5s infinite; }
@keyframes l3 { 0%, 24.44% { opacity: 0; } 25.72%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l3 { animation: l3 15.5s infinite; }
@keyframes l4 { 0%, 27.33% { opacity: 0; } 28.62%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l4 { animation: l4 15.5s infinite; }
@keyframes l5 { 0%, 34.08% { opacity: 0; } 35.37%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l5 { animation: l5 15.5s infinite; }
@keyframes c5 { 0%, 34.08% { transform: translateX(0); } 44.37%, 100% { transform: translateX(333px); } }
.c5 { animation: c5 15.5s infinite steps(38, end); }
@keyframes l6 { 0%, 50.16% { opacity: 0; } 51.45%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l6 { animation: l6 15.5s infinite; }
@keyframes l7 { 0%, 53.05% { opacity: 0; } 54.34%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l7 { animation: l7 15.5s infinite; }
@keyframes l8 { 0%, 55.95% { opacity: 0; } 57.23%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l8 { animation: l8 15.5s infinite; }
@keyframes l9 { 0%, 58.84% { opacity: 0; } 60.13%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l9 { animation: l9 15.5s infinite; }
@keyframes l10 { 0%, 61.74% { opacity: 0; } 63.02%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l10 { animation: l10 15.5s infinite; }
@keyframes l11 { 0%, 64.63% { opacity: 0; } 65.92%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l11 { animation: l11 15.5s infinite; }
@keyframes l12 { 0%, 67.52% { opacity: 0; } 68.81%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l12 { animation: l12 15.5s infinite; }
    </style>
    <clipPath id="screen"><rect x="0" y="0" width="960" height="426"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="425" rx="14"
        fill="#0f172a" stroke="#1e293b"/>
  <rect x="0.5" y="0.5" width="959" height="40" rx="14" fill="#1e293b"/>
  <rect x="0.5" y="26" width="959" height="15" fill="#1e293b"/>
  <circle cx="26" cy="21" r="6" fill="#f87171"/>
  <circle cx="46" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="21" r="6" fill="#4ade80"/>
  <text class="bar" x="480" y="25">rag-titan — terminal</text>
  <text class="t l0" x="44" y="90" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>rag-titan evaluate --input sample.json --output baseline.json --k 3</text>
<g clip-path="url(#screen)"><rect class="cover c0" x="60.9" y="73" width="578" height="24" fill="#0f172a"/></g>
  <text class="t l1" x="44" y="114" fill="#94a3b8">Reports saved: baseline.json and baseline.md</text>
  <text class="t l2" x="44" y="138" fill="#86efac">Overall score: 93.2/100 (Excellent)</text>
  <text class="t l3" x="44" y="162" fill="#94a3b8">Status: Evaluated | Measurement coverage: 97%</text>
  <text class="t l4" x="44" y="186" fill="#86efac">First failing stage: none</text>
  <text class="t l5" x="44" y="224" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python inspect_report.py baseline.json</text>
<g clip-path="url(#screen)"><rect class="cover c5" x="60.9" y="207" width="333" height="24" fill="#0f172a"/></g>
  <text class="t l6" x="44" y="248" fill="#94a3b8">retrieval.recall_at_k: 1.0</text>
  <text class="t l7" x="44" y="272" fill="#94a3b8">retrieval.mrr_at_k: 0.75</text>
  <text class="t l8" x="44" y="296" fill="#94a3b8">augmentation.context_sufficient: 1.0</text>
  <text class="t l9" x="44" y="320" fill="#94a3b8">generation.answer_f1: 1.0</text>
  <text class="t l10" x="44" y="344" fill="#94a3b8">generation.citation_precision: 1.0</text>
  <text class="t l11" x="44" y="368" fill="#94a3b8">generation.unsupported_number_rate: 0.0</text>
  <text class="t l12" x="44" y="392" fill="#86efac">First failing stage: none</text>
</svg>
