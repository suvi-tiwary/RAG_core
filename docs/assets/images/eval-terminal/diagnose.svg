<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546"
     width="960" height="546" role="img" aria-labelledby="title desc">
  <title id="title">rag-titan: Diagnose a bad answer</title>
  <desc id="desc">Search missed the evidence: the report names retrieval as the first failing stage and suggests a fix.</desc>
  <defs>
    <style>
