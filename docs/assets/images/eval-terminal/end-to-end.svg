  <text class="bar" x="480" y="25">rag-titan — terminal</text>
  <text class="t l0" x="44" y="90" fill="#7dd3fc"># 1. Write golden questions: question, reference answer, evidence quote</text>
<g clip-path="url(#screen)"><rect class="cover c0" x="44.0" y="73" width="612" height="24" fill="#0f172a"/></g>
  <text class="t l1" x="44" y="114" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>head -n 8 golden.json</text>
<g clip-path="url(#screen)"><rect class="cover c1" x="60.9" y="97" width="189" height="24" fill="#0f172a"/></g>
  <text class="t l2" x="44" y="138" fill="#94a3b8">[</text>
  <text class="t l3" x="44" y="162" fill="#94a3b8">  {</text>
  <text class="t l4" x="44" y="186" fill="#94a3b8">    "id": "q1",</text>
  <text class="t l5" x="44" y="210" fill="#94a3b8">    "question": "How many days of annual leave do employees get?",</text>
  <text class="t l6" x="44" y="234" fill="#94a3b8">    "expected_answer": "Employees get 25 days of annual leave.",</text>
  <text class="t l7" x="44" y="258" fill="#94a3b8">    "expected_evidence": [</text>
  <text class="t l8" x="44" y="282" fill="#94a3b8">      "Employees get 25 days of annual leave."</text>
  <text class="t l9" x="44" y="306" fill="#94a3b8">    ],</text>
  <text class="t l10" x="44" y="344" fill="#7dd3fc"># 2. Check them against your documents</text>
<g clip-path="url(#screen)"><rect class="cover c10" x="44.0" y="327" width="333" height="24" fill="#0f172a"/></g>
  <text class="t l11" x="44" y="368" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python check_golden.py</text>
<g clip-path="url(#screen)"><rect class="cover c11" x="60.9" y="351" width="198" height="24" fill="#0f172a"/></g>
  <text class="t l12" x="44" y="392" fill="#94a3b8">Questions: 2</text>
  <text class="t l13" x="44" y="416" fill="#94a3b8">Human-validated: 2</text>
  <text class="t l14" x="44" y="440" fill="#86efac">Ready: True</text>
  <text class="t l15" x="44" y="478" fill="#7dd3fc"># 3. Your RAG answers them; rag-titan scores every stage</text>
<g clip-path="url(#screen)"><rect class="cover c15" x="44.0" y="461" width="485" height="24" fill="#0f172a"/></g>
  <text class="t l16" x="44" y="502" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python live_evaluation.py</text>
<g clip-path="url(#screen)"><rect class="cover c16" x="60.9" y="485" width="223" height="24" fill="#0f172a"/></g>
  <text class="t l17" x="44" y="526" fill="#86efac">Overall score: 89.4/100 (Very Good)</text>
  <text class="t l18" x="44" y="550" fill="#94a3b8">Status: Evaluated | Measurement coverage: 76%</text>
  <text class="t l19" x="44" y="574" fill="#86efac">First failing stage: none</text>
  <text class="t l20" x="44" y="598" fill="#94a3b8">Not measured (null in the report) - to measure it:</text>
  <text class="t l21" x="44" y="622" fill="#94a3b8">  - task success: add "task_success" per query (a person's yes/no)</text>
  <text class="t l22" x="44" y="646" fill="#94a3b8">Saved live-data.json, live-report.json and live-report.md</text>
  <text class="t l23" x="44" y="684" fill="#7dd3fc"># 4. See what to fix</text>
<g clip-path="url(#screen)"><rect class="cover c23" x="44.0" y="667" width="181" height="24" fill="#0f172a"/></g>
  <text class="t l24" x="44" y="708" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python inspect_report.py live-report.json</text>
<g clip-path="url(#screen)"><rect class="cover c24" x="60.9" y="691" width="358" height="24" fill="#0f172a"/></g>
  <text class="t l25" x="44" y="732" fill="#94a3b8">retrieval.recall_at_k: 1.0</text>
  <text class="t l26" x="44" y="756" fill="#94a3b8">retrieval.mrr_at_k: 1.0</text>
  <text class="t l27" x="44" y="780" fill="#94a3b8">augmentation.context_sufficient: 1.0</text>
  <text class="t l28" x="44" y="804" fill="#94a3b8">generation.answer_f1: 1.0</text>
  <text class="t l29" x="44" y="828" fill="#94a3b8">generation.citation_precision: 1.0</text>
  <text class="t l30" x="44" y="852" fill="#94a3b8">generation.unsupported_number_rate: 0.0</text>
  <text class="t l31" x="44" y="876" fill="#86efac">First failing stage: none</text>
