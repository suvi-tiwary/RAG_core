<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 594"
     width="960" height="594" role="img" aria-labelledby="title desc">
  <title id="title">rag-titan: Evaluate your own RAG</title>
  <desc id="desc">Score a minimal file of your own logs; missing measurements are reported as not measured.</desc>
  <defs>
    <style>
.t { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.bar { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: #94a3b8; text-anchor: middle; }
@media (prefers-reduced-motion: reduce) {
  .t { animation: none !important; opacity: 1; }
  .cover { display: none; }
}
@keyframes l0 { 0%, 2.14% { opacity: 0; } 3.21%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l0 { animation: l0 18.7s infinite; }
@keyframes c0 { 0%, 2.14% { transform: translateX(0); } 10.70%, 100% { transform: translateX(637px); } }
.c0 { animation: c0 18.7s infinite steps(74, end); }
@keyframes l1 { 0%, 15.51% { opacity: 0; } 16.58%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l1 { animation: l1 18.7s infinite; }
@keyframes l2 { 0%, 17.91% { opacity: 0; } 18.98%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l2 { animation: l2 18.7s infinite; }
@keyframes l3 { 0%, 20.32% { opacity: 0; } 21.39%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l3 { animation: l3 18.7s infinite; }
@keyframes l4 { 0%, 22.73% { opacity: 0; } 23.80%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l4 { animation: l4 18.7s infinite; }
@keyframes l5 { 0%, 25.13% { opacity: 0; } 26.20%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l5 { animation: l5 18.7s infinite; }
@keyframes l6 { 0%, 27.54% { opacity: 0; } 28.61%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l6 { animation: l6 18.7s infinite; }
@keyframes l7 { 0%, 29.95% { opacity: 0; } 31.02%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l7 { animation: l7 18.7s infinite; }
@keyframes l8 { 0%, 32.35% { opacity: 0; } 33.42%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l8 { animation: l8 18.7s infinite; }
@keyframes l9 { 0%, 34.76% { opacity: 0; } 35.83%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l9 { animation: l9 18.7s infinite; }
@keyframes l10 { 0%, 37.17% { opacity: 0; } 38.24%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l10 { animation: l10 18.7s infinite; }
@keyframes l11 { 0%, 39.57% { opacity: 0; } 40.64%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l11 { animation: l11 18.7s infinite; }
@keyframes l12 { 0%, 45.19% { opacity: 0; } 46.26%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l12 { animation: l12 18.7s infinite; }
@keyframes c12 { 0%, 45.19% { transform: translateX(0); } 53.74%, 100% { transform: translateX(384px); } }
.c12 { animation: c12 18.7s infinite steps(44, end); }
@keyframes l13 { 0%, 58.56% { opacity: 0; } 59.63%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l13 { animation: l13 18.7s infinite; }
@keyframes l14 { 0%, 60.96% { opacity: 0; } 62.03%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l14 { animation: l14 18.7s infinite; }
@keyframes l15 { 0%, 63.37% { opacity: 0; } 64.44%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l15 { animation: l15 18.7s infinite; }
@keyframes l16 { 0%, 65.78% { opacity: 0; } 66.84%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l16 { animation: l16 18.7s infinite; }
@keyframes l17 { 0%, 68.18% { opacity: 0; } 69.25%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l17 { animation: l17 18.7s infinite; }
@keyframes l18 { 0%, 70.59% { opacity: 0; } 71.66%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l18 { animation: l18 18.7s infinite; }
@keyframes l19 { 0%, 72.99% { opacity: 0; } 74.06%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l19 { animation: l19 18.7s infinite; }
    </style>
    <clipPath id="screen"><rect x="0" y="0" width="960" height="594"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="593" rx="14"
        fill="#0f172a" stroke="#1e293b"/>
  <rect x="0.5" y="0.5" width="959" height="40" rx="14" fill="#1e293b"/>
  <rect x="0.5" y="26" width="959" height="15" fill="#1e293b"/>
  <circle cx="26" cy="21" r="6" fill="#f87171"/>
  <circle cx="46" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="21" r="6" fill="#4ade80"/>
  <text class="bar" x="480" y="25">rag-titan — terminal</text>
  <text class="t l0" x="44" y="90" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>rag-titan evaluate --input minimal.json --output minimal-report.json --k 1</text>
<g clip-path="url(#screen)"><rect class="cover c0" x="60.9" y="73" width="637" height="24" fill="#0f172a"/></g>
  <text class="t l1" x="44" y="114" fill="#94a3b8">Reports saved: minimal-report.json and minimal-report.md</text>
  <text class="t l2" x="44" y="138" fill="#86efac">Overall score: 100.0/100 (Excellent)</text>
  <text class="t l3" x="44" y="162" fill="#fde68a">Status: Provisional | Measurement coverage: 27%</text>
  <text class="t l4" x="44" y="186" fill="#86efac">First failing stage: none</text>
  <text class="t l5" x="44" y="210" fill="#94a3b8">Not measured (null in the report) - to measure it:</text>
  <text class="t l6" x="44" y="234" fill="#94a3b8">  - semantic indexing: add "embeddings" (chunk and query vectors)</text>
  <text class="t l7" x="44" y="258" fill="#94a3b8">  - search ordering: add "reranked_ids" (only if you have a reranker)</text>
  <text class="t l8" x="44" y="282" fill="#94a3b8">  - context and evidence checks: add "documents" and "expected_evidence" (build_dataset() does it)</text>
  <text class="t l9" x="44" y="306" fill="#94a3b8">  - task success: add "task_success" per query (a person's yes/no)</text>
  <text class="t l10" x="44" y="330" fill="#94a3b8">  - refusals: add a question with "answerable": false and "abstained"</text>
  <text class="t l11" x="44" y="354" fill="#94a3b8">  - end-to-end time and cost: add "latency_ms", "cost_usd", "total_tokens"</text>
  <text class="t l12" x="44" y="392" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python inspect_report.py minimal-report.json</text>
<g clip-path="url(#screen)"><rect class="cover c12" x="60.9" y="375" width="384" height="24" fill="#0f172a"/></g>
  <text class="t l13" x="44" y="416" fill="#94a3b8">retrieval.recall_at_k: 1.0</text>
  <text class="t l14" x="44" y="440" fill="#94a3b8">retrieval.mrr_at_k: 1.0</text>
  <text class="t l15" x="44" y="464" fill="#fde68a">augmentation.context_sufficient: not measured</text>
  <text class="t l16" x="44" y="488" fill="#94a3b8">generation.answer_f1: 1.0</text>
  <text class="t l17" x="44" y="512" fill="#fde68a">generation.citation_precision: not measured</text>
  <text class="t l18" x="44" y="536" fill="#94a3b8">generation.unsupported_number_rate: 0.0</text>
  <text class="t l19" x="44" y="560" fill="#86efac">First failing stage: none</text>
</svg>
