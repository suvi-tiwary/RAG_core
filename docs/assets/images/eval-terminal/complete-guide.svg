<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 622"
     width="960" height="622" role="img" aria-labelledby="title desc">
  <title id="title">rag-titan: Evaluate your RAG, start to finish</title>
  <desc id="desc">A small stand-in RAG answers five golden questions and logs what it did; the logs become one data file, and rag-titan scores every stage.</desc>
  <defs>
    <style>
