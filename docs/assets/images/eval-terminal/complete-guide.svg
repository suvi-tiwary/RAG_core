.l4 { animation: l4 27.4s infinite; }
@keyframes c4 { 0%, 26.05% { transform: translateX(0); } 31.88%, 100% { transform: translateX(173px); } }
.c4 { animation: c4 27.4s infinite steps(19, end); }
@keyframes l5 { 0%, 35.15% { opacity: 0; } 35.88%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l5 { animation: l5 27.4s infinite; }
@keyframes l6 { 0%, 38.98% { opacity: 0; } 39.71%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l6 { animation: l6 27.4s infinite; }
@keyframes c6 { 0%, 38.98% { transform: translateX(0); } 44.81%, 100% { transform: translateX(181px); } }
.c6 { animation: c6 27.4s infinite steps(20, end); }
