.l8 { animation: l8 27.4s infinite; }
@keyframes c8 { 0%, 51.91% { transform: translateX(0); } 57.74%, 100% { transform: translateX(173px); } }
.c8 { animation: c8 27.4s infinite steps(19, end); }
@keyframes l9 { 0%, 57.74% { opacity: 0; } 58.47%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l9 { animation: l9 27.4s infinite; }
@keyframes c9 { 0%, 57.74% { transform: translateX(0); } 63.57%, 100% { transform: translateX(604px); } }
