    <clipPath id="screen"><rect x="0" y="0" width="960" height="622"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="621" rx="14"
        fill="#0f172a" stroke="#1e293b"/>
  <rect x="0.5" y="0.5" width="959" height="40" rx="14" fill="#1e293b"/>
  <rect x="0.5" y="26" width="959" height="15" fill="#1e293b"/>
  <circle cx="26" cy="21" r="6" fill="#f87171"/>
  <circle cx="46" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="21" r="6" fill="#4ade80"/>
  <text class="bar" x="480" y="25">rag-titan — terminal</text>
  <text class="t l0" x="44" y="90" fill="#7dd3fc"># Your RAG answers the golden questions and saves what it did</text>
<g clip-path="url(#screen)"><rect class="cover c0" x="44.0" y="73" width="527" height="24" fill="#0f172a"/></g>
  <text class="t l1" x="44" y="114" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python my_rag.py</text>
<g clip-path="url(#screen)"><rect class="cover c1" x="60.9" y="97" width="147" height="24" fill="#0f172a"/></g>
  <text class="t l2" x="44" y="138" fill="#94a3b8">Answered 5 questions -&gt; my_rag_logs.json</text>
  <text class="t l3" x="44" y="176" fill="#7dd3fc"># Join the logs with golden.json, then add chunking and embedding inputs</text>
<g clip-path="url(#screen)"><rect class="cover c3" x="44.0" y="159" width="620" height="24" fill="#0f172a"/></g>
  <text class="t l4" x="44" y="200" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python make_data.py</text>
<g clip-path="url(#screen)"><rect class="cover c4" x="60.9" y="183" width="173" height="24" fill="#0f172a"/></g>
  <text class="t l5" x="44" y="224" fill="#94a3b8">Wrote my-data.json: 5 queries, 5 chunks</text>
  <text class="t l6" x="44" y="262" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python add_stages.py</text>
<g clip-path="url(#screen)"><rect class="cover c6" x="60.9" y="245" width="181" height="24" fill="#0f172a"/></g>
  <text class="t l7" x="44" y="286" fill="#94a3b8">Wrote eval-data.json: chunking and embedding inputs added</text>
  <text class="t l8" x="44" y="324" fill="#7dd3fc"># Score every stage</text>
<g clip-path="url(#screen)"><rect class="cover c8" x="44.0" y="307" width="173" height="24" fill="#0f172a"/></g>
  <text class="t l9" x="44" y="348" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>rag-titan evaluate --input eval-data.json --output baseline.json --k 3</text>
<g clip-path="url(#screen)"><rect class="cover c9" x="60.9" y="331" width="604" height="24" fill="#0f172a"/></g>
  <text class="t l10" x="44" y="372" fill="#94a3b8">Reports saved: baseline.json and baseline.md</text>
  <text class="t l11" x="44" y="396" fill="#86efac">Overall score: 81.2/100 (Very Good)</text>
  <text class="t l12" x="44" y="420" fill="#fde68a">Status: Provisional | Measurement coverage: 75%</text>
  <text class="t l13" x="44" y="444" fill="#fdba74">First failing stage: generation</text>
  <text class="t l14" x="44" y="468" fill="#94a3b8">Queries to look at:</text>
  <text class="t l15" x="44" y="492" fill="#94a3b8">  - q5 (generation): answered when it should refuse, or the reverse</text>
  <text class="t l16" x="44" y="516" fill="#94a3b8">  - q4 (generation): answer differs from the reference (F1 0.00)</text>
  <text class="t l17" x="44" y="540" fill="#94a3b8">Not measured (null in the report) - to measure it:</text>
  <text class="t l18" x="44" y="564" fill="#94a3b8">  - search ordering: add "reranked_ids" (only if you have a reranker)</text>
  <text class="t l19" x="44" y="588" fill="#94a3b8">  - task success: add "task_success" per query (a person's yes/no)</text>
</svg>
