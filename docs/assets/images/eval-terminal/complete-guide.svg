.bar { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: #94a3b8; text-anchor: middle; }
@media (prefers-reduced-motion: reduce) {
  .t { animation: none !important; opacity: 1; }
  .cover { display: none; }
}
@keyframes l0 { 0%, 1.46% { opacity: 0; } 2.19%, 94% { opacity: 1; } 100% { opacity: 0; } }
.l0 { animation: l0 27.4s infinite; }
@keyframes c0 { 0%, 1.46% { transform: translateX(0); } 7.29%, 100% { transform: translateX(527px); } }
.c0 { animation: c0 27.4s infinite steps(61, end); }
