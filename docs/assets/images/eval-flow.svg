<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590"
     width="960" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Evaluate any RAG with rag-titan</title>
  <desc id="desc">Your RAG logs its outputs into one JSON file with golden labels. rag-titan evaluate scores every stage from 0 to 100 and names the first failing stage with a hint. Real scores from the cookbook's missed-evidence example: overall 63.2, first failing stage Search.</desc>
  <defs>
    <style>
.bg { fill: #ffffff; stroke: #e2e8f0; }
.title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
.sub { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
.label { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
.small { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
.num { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
.big { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
.warn { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c2410c; }
.neutral, .search, .llm { stroke-width: 1.5; }
.neutral { fill: #f8fafc; stroke: #94a3b8; } .search { fill: #ecfeff; stroke: #06b6d4; }
.llm { fill: #fffbeb; stroke: #f59e0b; }
.card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
.track { fill: #e2e8f0; }
.flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5;
        animation: dash 0.9s linear infinite; }
.bar { transform-box: fill-box; transform-origin: left center; }
@keyframes dash { to { stroke-dashoffset: -11; } }
@media (prefers-reduced-motion: reduce) {
  .flow, .anim { animation: none !important; opacity: 1 !important; transform: none !important; }
  .glow { display: none; }
}
@keyframes g0 { 0%, 2.1% { opacity: 0; } 3.6%, 10.0% { opacity: 1; } 12.1%, 100% { opacity: 0; } }
.g0 { animation: g0 14.0s infinite; }
@keyframes g1 { 0%, 8.6% { opacity: 0; } 10.0%, 16.4% { opacity: 1; } 18.6%, 100% { opacity: 0; } }
.g1 { animation: g1 14.0s infinite; }
@keyframes g2 { 0%, 15.0% { opacity: 0; } 16.4%, 22.9% { opacity: 1; } 25.0%, 100% { opacity: 0; } }
.g2 { animation: g2 14.0s infinite; }
@keyframes b0 { 0%, 22.9% { transform: scaleX(0); } 27.1%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b0 { animation: b0 14.0s infinite; }
@keyframes s0 { 0%, 25.7% { opacity: 0; } 30.0%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s0 { animation: s0 14.0s infinite; }
@keyframes b1 { 0%, 26.4% { transform: scaleX(0); } 30.7%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b1 { animation: b1 14.0s infinite; }
@keyframes s1 { 0%, 29.3% { opacity: 0; } 33.6%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s1 { animation: s1 14.0s infinite; }
@keyframes b2 { 0%, 30.0% { transform: scaleX(0); } 34.3%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b2 { animation: b2 14.0s infinite; }
@keyframes s2 { 0%, 32.9% { opacity: 0; } 37.1%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s2 { animation: s2 14.0s infinite; }
@keyframes fail { 0%, 51.4% { opacity: 0; } 55.7%, 95% { opacity: 1; } 100% { opacity: 0; } }
.fail { animation: fail 14.0s infinite; }
@keyframes b3 { 0%, 33.6% { transform: scaleX(0); } 37.9%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b3 { animation: b3 14.0s infinite; }
@keyframes s3 { 0%, 36.4% { opacity: 0; } 40.7%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s3 { animation: s3 14.0s infinite; }
@keyframes b4 { 0%, 37.1% { transform: scaleX(0); } 41.4%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b4 { animation: b4 14.0s infinite; }
@keyframes s4 { 0%, 40.0% { opacity: 0; } 44.3%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s4 { animation: s4 14.0s infinite; }
@keyframes b5 { 0%, 40.7% { transform: scaleX(0); } 45.0%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b5 { animation: b5 14.0s infinite; }
@keyframes s5 { 0%, 43.6% { opacity: 0; } 47.9%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s5 { animation: s5 14.0s infinite; }
@keyframes b6 { 0%, 44.3% { transform: scaleX(0); } 48.6%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.b6 { animation: b6 14.0s infinite; }
@keyframes s6 { 0%, 47.1% { opacity: 0; } 51.4%, 95% { opacity: 1; } 100% { opacity: 0; } }
.s6 { animation: s6 14.0s infinite; }
@keyframes res { 0%, 55.7% { opacity: 0; } 60.0%, 95% { opacity: 1; } 100% { opacity: 0; } }
.res { animation: res 14.0s infinite; }
</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="589" rx="16"/>
  <text class="title" x="30" y="44">Evaluate any RAG: your logs in, the stage to fix out</text>
  <text class="sub" x="30" y="68">rag-titan evaluate --input my-data.json --output report.json --k 3</text>
  <rect class="neutral" x="30" y="96" width="280" height="92" rx="12"/>
  <text class="label" x="48" y="126">1. Your RAG</text>
  <text class="small" x="48" y="150">any framework, model</text>
  <text class="small" x="48" y="168">or vector database</text>
  <rect class="glow g0" x="27" y="93" width="286" height="98" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <path class="flow" d="M314 142 H336" marker-end="url(#arrow)"/>
  <rect class="search" x="340" y="96" width="280" height="92" rx="12"/>
  <text class="label" x="358" y="126">2. my-data.json</text>
  <text class="small" x="358" y="150">your logged outputs +</text>
  <text class="small" x="358" y="168">golden labels</text>
  <rect class="glow g1" x="337" y="93" width="286" height="98" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <path class="flow" d="M624 142 H646" marker-end="url(#arrow)"/>
  <rect class="llm" x="650" y="96" width="280" height="92" rx="12"/>
  <text class="label" x="668" y="126">3. rag-titan evaluate</text>
  <text class="small" x="668" y="150">7 stage evaluators,</text>
  <text class="small" x="668" y="168">no LLM judge needed</text>
  <rect class="glow g2" x="647" y="93" width="286" height="98" rx="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <path class="flow" d="M790 190 V222 H310 V236" marker-end="url(#arrow)"/>
  <rect class="card" x="30" y="240" width="560" height="296" rx="12"/>
  <text class="label" x="50" y="270">Score of every stage (0 to 100)</text>
  <text class="small" x="50" y="306">Chunking</text>
  <rect class="track" x="150" y="292" width="340" height="18" rx="4"/>
  <rect class="bar anim b0" x="150" y="292" width="331.9" height="18" rx="4" fill="#22c55e"/>
  <text class="num anim s0" x="502" y="306">98</text>
  <text class="small" x="50" y="340">Embedding</text>
  <rect class="track" x="150" y="326" width="340" height="18" rx="4"/>
  <rect class="bar anim b1" x="150" y="326" width="334.6" height="18" rx="4" fill="#22c55e"/>
  <text class="num anim s1" x="502" y="340">98</text>
  <text class="small" x="50" y="374">Search</text>
  <rect class="track" x="150" y="360" width="340" height="18" rx="4"/>
  <rect class="bar anim b2" x="150" y="360" width="142.7" height="18" rx="4" fill="#f97316"/>
  <text class="num anim s2" x="502" y="374">42</text>
  <rect class="anim fail" x="40" y="354" width="540" height="30" rx="6" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text class="small" x="50" y="408">Reranking</text>
  <rect class="track" x="150" y="394" width="340" height="18" rx="4"/>
  <rect class="bar anim b3" x="150" y="394" width="198.3" height="18" rx="4" fill="#f97316"/>
  <text class="num anim s3" x="502" y="408">58</text>
  <text class="small" x="50" y="442">Context</text>
  <rect class="track" x="150" y="428" width="340" height="18" rx="4"/>
  <rect class="bar anim b4" x="150" y="428" width="197.0" height="18" rx="4" fill="#f97316"/>
  <text class="num anim s4" x="502" y="442">58</text>
  <text class="small" x="50" y="476">Answer</text>
  <rect class="track" x="150" y="462" width="340" height="18" rx="4"/>
  <rect class="bar anim b5" x="150" y="462" width="239.2" height="18" rx="4" fill="#f59e0b"/>
  <text class="num anim s5" x="502" y="476">70</text>
  <text class="small" x="50" y="510">End to end</text>
  <rect class="track" x="150" y="496" width="340" height="18" rx="4"/>
  <rect class="bar anim b6" x="150" y="496" width="170.0" height="18" rx="4" fill="#f97316"/>
  <text class="num anim s6" x="502" y="510">50</text>
  <g class="anim res">
  <rect class="card" x="620" y="240" width="310" height="296" rx="12"/>
  <text class="label" x="640" y="270">Result</text>
  <text class="big" x="640" y="318">63.2<tspan class="small"> / 100</tspan></text>
  <text class="small" x="640" y="344">Average · Action Required</text>
  <text class="warn" x="640" y="384">First failing stage:</text>
  <text class="warn" x="640" y="404">Search</text>
  <text class="label" x="640" y="444">What to try</text>
  <text class="small" x="640" y="466">Try hybrid retrieval or query</text>
  <text class="small" x="640" y="484">rewriting, or raise top-k.</text>
  </g>
  <text class="small" x="30" y="568">Real scores: the cookbook's missed-evidence.json, where search misses the evidence for one question.</text>
</svg>
