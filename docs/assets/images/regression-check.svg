<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">A regression check in plain words</title>
  <desc id="desc">The baseline report from last time and the candidate report from the new run are compared metric by metric. Retrieval recall at 3 went from 1.0 to 0.5, which is worse by more than the tolerance, so the command exits with code 1 and a CI build fails. If nothing got worse, it exits with code 0 and the build passes.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .search { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .llm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .good { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; }
      .edgetext { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="329" rx="16"/>
  <text class="title" x="30" y="42">A regression check: is the new run worse than the last one?</text>

  <rect class="neutral" x="30" y="70" width="250" height="88" rx="12"/>
  <text class="label" x="48" y="98">1. Baseline (last time)</text>
  <text class="mono" x="48" y="122">baseline.json · 93.2/100</text>
  <text class="small" x="48" y="144">a saved report you trust</text>

  <rect class="search" x="30" y="190" width="250" height="88" rx="12"/>
  <text class="label" x="48" y="218">2. Candidate (new run)</text>
  <text class="mono" x="48" y="242">candidate.json · 62.5/100</text>
  <text class="small" x="48" y="264">after you changed something</text>

  <path class="edge" d="M280 114 H330 V160 H352" marker-end="url(#arrow)"/>
  <path class="edge" d="M280 234 H330 V188 H352" marker-end="url(#arrow)"/>

  <rect class="llm" x="356" y="120" width="250" height="108" rx="12"/>
  <text class="label" x="374" y="148">3. Compare every metric</text>
  <text class="mono" x="374" y="174">recall_at_k  1.0 → 0.5</text>
  <text class="small" x="374" y="198">worse by more than the</text>
  <text class="small" x="374" y="216">tolerance? that is a regression</text>

  <path class="edge" d="M606 160 H650 V114 H676" marker-end="url(#arrow)"/>
  <text class="edgetext" x="614" y="104">worse</text>
  <path class="edge" d="M606 188 H650 V234 H676" marker-end="url(#arrow)"/>
  <text class="edgetext" x="602" y="252">not worse</text>

  <rect class="bad" x="680" y="70" width="250" height="88" rx="12"/>
  <text class="label" x="698" y="98">Exit code 1</text>
  <text class="small" x="698" y="122">--fail-on-regression stops here:</text>
  <text class="small" x="698" y="142">the CI build fails, nothing ships</text>

  <rect class="good" x="680" y="190" width="250" height="88" rx="12"/>
  <text class="label" x="698" y="218">Exit code 0</text>
  <text class="small" x="698" y="242">no metric got worse:</text>
  <text class="small" x="698" y="262">the CI build passes</text>

  <text class="small" x="30" y="312">Real numbers from this recipe: sample.json (baseline) and missed-evidence.json (candidate).</text>
</svg>
